<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShipSafe orders</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7; --card: #fff; --soft: #f5f5f7; --line: #e8e8ed; --text: #1d1d1f;
      --muted: #6e6e73; --link: #0066cc; --select: #e8f0fe;
      --ship: #248a3d; --ship-soft: #e9f6ec; --contact: #b25000; --contact-soft: #fff4e5;
      --hold: #d70015; --hold-soft: #ffebec;
      --nav: rgba(251, 251, 253, .8);
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 24px rgba(0, 0, 0, .04);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
              system-ui, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
                 "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000; --card: #1d1d1f; --soft: #2c2c2e; --line: #38383a; --text: #f5f5f7;
        --muted: #a1a1a6; --link: #2997ff; --select: #1c2a40;
        --ship: #30d158; --ship-soft: rgba(48, 209, 88, .14); --contact: #ff9f0a;
        --contact-soft: rgba(255, 159, 10, .14); --hold: #ff453a; --hold-soft: rgba(255, 69, 58, .14);
        --nav: rgba(22, 22, 23, .8); --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body { font: 1.0625rem/1.47 var(--font); letter-spacing: -0.022em; margin: 0; background: var(--bg);
           color: var(--text); -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Frosted global bar: content scrolls under it */
    nav { position: sticky; top: 0; z-index: 2; height: 3rem; background: var(--nav);
          backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
    @media (prefers-reduced-transparency: reduce) {
      nav { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    .bar { max-width: 64rem; height: 100%; margin: 0 auto; padding: 0 1.375rem; display: flex;
           align-items: center; gap: 1.5rem; font-size: .75rem; letter-spacing: -0.01em; }
    .brand { font-size: 1.0625rem; font-weight: 600; color: var(--text); margin-right: auto; }
    .bar a:not(.brand) { color: var(--text); opacity: .8; }
    .bar a[aria-current] { opacity: 1; font-weight: 600; }

    .page { max-width: 64rem; margin: 0 auto; padding: 0 1.375rem 5rem; }
    .hero { padding: 3.5rem 0 2rem; }
    .hero h1 { font: 600 3rem/1.08 var(--display); letter-spacing: -0.03em; margin: 0; }
    .hero p { font-size: 1.3125rem; line-height: 1.38; letter-spacing: .011em; color: var(--muted);
              margin: .5rem 0 0; }
    .live { display: inline-flex; align-items: center; gap: .375rem; font-size: .875rem; color: var(--muted);
            margin-top: 1rem; letter-spacing: -0.01em; }
    .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ship); }
    .live.offline .dot { background: var(--hold); }
    @media (max-width: 40rem) {
      .hero { padding: 2.5rem 0 1.5rem; }
      .hero h1 { font-size: 2.25rem; }
      .hero p { font-size: 1.125rem; }
    }

    .card { background: var(--card); border-radius: 1.125rem; box-shadow: var(--shadow); min-width: 0; }

    /* Icons are static SVG templates, cloned by the page */
    .icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
    .badge { width: 2.25rem; height: 2.25rem; border-radius: .625rem; display: grid; place-items: center; flex-shrink: 0; }
    .ship .badge, .badge.ship { color: var(--ship); background: var(--ship-soft); }
    .contact_buyer .badge, .badge.contact_buyer { color: var(--contact); background: var(--contact-soft); }
    .hold .badge, .badge.hold { color: var(--hold); background: var(--hold-soft); }

    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin-bottom: .75rem; }
    .tile { padding: 1.25rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem 1rem;
            align-items: center; }
    .tile .badge { grid-row: span 2; width: 2.75rem; height: 2.75rem; border-radius: .75rem; }
    .tile .badge .icon { width: 1.5rem; height: 1.5rem; }
    .tile .n { font: 600 2.25rem/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .tile .n small { font: 500 .875rem/1 var(--font); color: var(--muted); letter-spacing: -0.01em; margin-left: .5rem; }
    .tile .label { font-size: .875rem; color: var(--muted); letter-spacing: -0.01em; }
    @media (max-width: 46rem) {
      .tile { grid-template-columns: minmax(0, 1fr); padding: .875rem 1rem; }
      .tile .badge { grid-row: auto; width: 2.25rem; height: 2.25rem; margin-bottom: .375rem; }
      .tile .n { font-size: 1.75rem; }
      .tile .n small { display: block; margin: .375rem 0 0; }
    }

    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: .75rem; align-items: start; }
    @media (max-width: 52rem) { main { grid-template-columns: minmax(0, 1fr); } }

    /* Queue */
    .queue { padding: .5rem; }
    .queue h2 { font-size: .8125rem; font-weight: 600; color: var(--muted); letter-spacing: -0.01em;
                margin: .625rem .75rem .5rem; }
    .rows { list-style: none; margin: 0; padding: 0; }
    .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .125rem .875rem; align-items: center;
           padding: .75rem; border-radius: .75rem; cursor: pointer; outline: none; }
    .avatar { grid-row: span 2; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center;
              font-size: .875rem; font-weight: 600; letter-spacing: 0; }
    .avatar.ship { color: var(--ship); background: var(--ship-soft); }
    .avatar.contact_buyer { color: var(--contact); background: var(--contact-soft); }
    .avatar.hold { color: var(--hold); background: var(--hold-soft); }
    @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--soft); } }
    .row[aria-selected="true"] { background: var(--select); }
    /* Feedback on press, not on release */
    .row { transition: transform 100ms ease-out; }
    .row:active { transform: scale(.98); }
    .row:focus-visible { box-shadow: 0 0 0 3px var(--link); }
    .row .who { font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .amount { font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; text-align: right; }
    .row .sub { font-size: .8125rem; color: var(--muted); letter-spacing: -0.01em; }
    .row .pill { justify-self: end; }

    /* An order that arrives while the page is open slides in once. Selecting never animates. */
    .row.arrived { animation: arrive 300ms var(--ease-out), flash 1.6s ease-out; }
    @keyframes arrive { from { opacity: 0; transform: translateY(-8px); } }
    @keyframes flash { from { background: var(--select); } }
    @media (prefers-reduced-motion: reduce) {
      .row.arrived { animation: fade 200ms ease; }
      @keyframes fade { from { opacity: 0; } }
    }

    .pill { display: inline-flex; align-items: center; padding: .1875rem .625rem; border-radius: 980px;
            font-size: .75rem; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
    .pill.ship { color: var(--ship); background: var(--ship-soft); }
    .pill.contact_buyer { color: var(--contact); background: var(--contact-soft); }
    .pill.hold { color: var(--hold); background: var(--hold-soft); }

    /* Detail */
    #detail { padding: 2rem; }
    @media (max-width: 40rem) { #detail { padding: 1.5rem 1.25rem; } }
    .eyebrow { font-size: .875rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    .eyebrow.ship { color: var(--ship); }
    .eyebrow.contact_buyer { color: var(--contact); }
    .eyebrow.hold { color: var(--hold); }
    .head { display: flex; gap: 1rem; align-items: flex-start; }
    .head .badge { width: 3.25rem; height: 3.25rem; border-radius: .875rem; }
    .head .badge .icon { width: 1.75rem; height: 1.75rem; }
    #detail h2 { font: 600 2rem/1.125 var(--display); letter-spacing: -0.028em; margin: .25rem 0 0; }
    .reason { font-size: 1.0625rem; color: var(--muted); margin: .75rem 0 0; }
    .meta { font-size: .8125rem; color: var(--muted); margin: .5rem 0 0; letter-spacing: -0.01em; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-size: .75rem; }

    .meter { margin-top: 1.5rem; }
    .track { position: relative; height: .375rem; border-radius: 980px; background: var(--soft); }
    .fill { position: absolute; inset: 0 auto 0 0; border-radius: 980px; }
    .fill.ship { background: var(--ship); }
    .fill.contact_buyer { background: var(--contact); }
    .fill.hold { background: var(--hold); }
    .line { position: absolute; top: -.375rem; bottom: -.375rem; width: 2px; margin-left: -1px;
            background: var(--text); border-radius: 1px; }
    .legend { display: flex; justify-content: space-between; gap: 1rem; margin-top: .5rem;
              font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

    .block { margin-top: 2.25rem; }
    .block h3 { font: 600 1.3125rem/1.2 var(--display); letter-spacing: .009em; margin: 0 0 .75rem; }
    .explanation { margin: 0; }
    ul { margin: .875rem 0 0; padding-left: 1.25rem; }
    li + li { margin-top: .375rem; }
    .looked { font-size: .8125rem; color: var(--muted); margin: 1rem 0 0; letter-spacing: -0.01em; }

    /* What the AI looked up: the lookups it used are lit, the rest are dimmed */
    .lookups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-top: 1.25rem; }
    @media (max-width: 30rem) { .lookups { grid-template-columns: minmax(0, 1fr); } }
    .lookup { display: flex; gap: .625rem; align-items: center; padding: .75rem .875rem; border-radius: .75rem;
              background: var(--soft); font-size: .8125rem; line-height: 1.3; letter-spacing: -0.01em; }
    .lookup .icon { color: var(--link); }
    .lookup.unused { color: var(--muted); }
    .lookup.unused .icon { color: var(--muted); opacity: .6; }
    .lookup small { display: block; color: var(--muted); font-size: .75rem; }

    /* How it was decided: four stops on one line */
    .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; }
    .stop { position: relative; padding: 0 .25rem; }
    .stop:not(:last-child)::after { content: ""; position: absolute; top: 1.125rem; height: 2px;
                                    left: calc(50% + 1.5rem); right: calc(-50% + 1.5rem); background: var(--line); }
    .stop .badge { margin: 0 auto .625rem; border-radius: 50%; }
    .badge.none { color: var(--muted); background: var(--soft); }
    .stop .label { font-size: .75rem; color: var(--muted); letter-spacing: -0.01em; }
    .stop .value { font-weight: 600; font-size: .9375rem; }
    .money { font-size: .875rem; color: var(--muted); margin: 1.25rem 0 0; text-align: center;
             font-variant-numeric: tabular-nums; }

    .signals { list-style: none; padding: 0; margin: 0; }
    .signals li { display: flex; gap: .75rem; align-items: baseline; padding: .625rem 0; font-size: .9375rem;
                  margin: 0; }
    .signals li + li { border-top: 1px solid var(--line); }
    .level { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
             padding: .125rem .5rem; border-radius: 980px; min-width: 3.5rem; text-align: center; flex-shrink: 0; }
    .level-ok, .level-info { background: var(--soft); color: var(--muted); }
    .level-watch { background: var(--contact-soft); color: var(--contact); }
    .level-risk { background: var(--hold-soft); color: var(--hold); }

    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .5rem 1.5rem; margin: 0;
         font-size: .9375rem; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    blockquote { margin: 0; padding: 1rem 1.25rem; background: var(--soft); border-radius: .75rem;
                 white-space: pre-wrap; }
    .errors { color: var(--hold); margin: 0; }
    .empty { padding: 3rem 1.5rem; color: var(--muted); text-align: center; margin: 0; }
  </style>
</head>
<body>
  <nav aria-label="ShipSafe">
    <div class="bar">
      <a class="brand" href="/seller">ShipSafe</a>
      <a href="/">Store</a>
      <a href="/seller" aria-current="page">Orders</a>
    </div>
  </nav>
  <div class="page">
    <div class="hero">
      <h1>Orders.</h1>
      <p>Every paid order, checked before you ship.</p>
      <div class="live" id="status" role="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
    </div>
    <div class="tiles" id="counts"></div>
    <main>
      <section class="card queue" aria-label="Orders">
        <h2>Latest</h2>
        <ul class="rows" id="rows" role="listbox" aria-label="Latest orders"></ul>
        <p class="empty" id="empty" hidden>No orders yet. Buy something in the <a href="/">store</a>.</p>
      </section>
      <section class="card" id="detail" aria-label="Order detail" aria-live="polite">
        <p class="empty">Choose an order to see why ShipSafe decided what it did.</p>
      </section>
    </main>
  </div>

  <!-- Icons, cloned by name -->
  <template id="icon-ship"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/></svg></template>
  <template id="icon-contact_buyer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-4.5 3.5v-3.5h-1a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></svg></template>
  <template id="icon-hold"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg></template>
  <template id="icon-rules"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg></template>
  <template id="icon-ai"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4l1.8 4.9 4.9 1.8-4.9 1.8L11 17.4l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18 15.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg></template>
  <template id="icon-risk"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 5 6.2v5.3c0 4.2 2.9 7.4 7 9 4.1-1.6 7-4.8 7-9V6.2z"/></svg></template>
  <template id="icon-get_buyer_history"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></template>
  <template id="icon-get_address_history"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></template>
  <template id="icon-get_shop_baseline"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></svg></template>

  <script>
    // Every value from the server goes in with textContent: buyer-written names and the AI's
    // text are shown as text, never run as HTML.
    const ACTIONS = { ship: "Ship", contact_buyer: "Contact buyer", hold: "Hold" };
    const TILE_LABELS = { ship: "Ready to ship", contact_buyer: "Check with buyer", hold: "On hold" };
    const VERDICTS = {
      ship: "Safe to ship.",
      contact_buyer: "Check with the buyer first.",
      hold: "Hold this order.",
    };
    const TOOLS = {
      get_buyer_history: "The buyer's past orders",
      get_address_history: "Past orders to this address",
      get_shop_baseline: "What is normal for this shop",
    };
    const BAND_TONE = { low: "ship", medium: "contact_buyer", high: "hold" };
    const PROTECTION = {
      ELIGIBLE: "Eligible", PARTIALLY_ELIGIBLE: "Partly eligible", NOT_ELIGIBLE: "Not eligible",
    };
    const REFRESH_MS = 10000;

    let orders = [];
    let selected = null;
    let following = true;     // show the newest order until the seller picks one
    let seen = null;          // order ids already on screen; null before the first load
    let lastUpdate = 0;
    let lastData = null;      // the last response, so an unchanged queue isn't redrawn

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (key === "class") node.className = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) {
        node.append(child instanceof Node ? child : document.createTextNode(String(child ?? "")));
      }
      return node;
    }

    const money = (order, cents) => `$${cents === undefined ? order.amount : (cents / 100).toFixed(2)}`;
    const percent = (p) => (p === null || p === undefined) ? "?" : `${Math.round(p * 100)}%`;
    const when = (epoch) => new Date(epoch * 1000).toLocaleString([], {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const pill = (action) => el("span", { class: `pill ${action}` }, ACTIONS[action] || action);
    const capital = (text) => text ? text[0].toUpperCase() + text.slice(1) : text;
    const initials = (name) => (name || "").split(/\s+/).filter(Boolean).slice(0, 2)
      .map(word => [...word][0].toUpperCase()).join("") || "?";

    // A medium-risk order can still ship when the money at risk is small, but it isn't "safe"
    const verdict = (order) => order.action === "ship" && order.band !== "low"
      ? "OK to ship. Worth a look." : VERDICTS[order.action] || order.action;

    function icon(name) {
      const template = document.getElementById(`icon-${name}`);
      return template ? template.content.firstElementChild.cloneNode(true) : el("span", { class: "icon" });
    }

    function renderCounts() {
      document.getElementById("counts").replaceChildren(...Object.keys(ACTIONS).map(action => {
        const group = orders.filter(o => o.action === action);
        const total = group.reduce((sum, o) => sum + Number(o.amount), 0);
        return el("div", { class: `card tile ${action}` },
          el("span", { class: "badge" }, icon(action)),
          el("div", { class: "n" }, group.length,
            el("small", {}, `$${total.toLocaleString("en-US", { maximumFractionDigits: 2 })}`)),
          el("div", { class: "label" }, TILE_LABELS[action]));
      }));
    }

    function choose(orderId, focus = false) {
      selected = orderId;
      following = false;
      renderRows();
      renderDetail();
      if (focus) document.querySelector(`.row[data-id="${CSS.escape(orderId)}"]`)?.focus();
    }

    function renderRows() {
      document.getElementById("rows").replaceChildren(...orders.map((order, index) => {
        const row = el("li", { class: "row", tabindex: "0", role: "option", "data-id": order.order_id,
                               "aria-selected": String(order.order_id === selected) },
          el("span", { class: `avatar ${order.action}`, "aria-hidden": "true" }, initials(order.buyer.name)),
          el("div", { class: "who" }, order.buyer.name),
          el("div", { class: "amount" }, money(order)),
          el("div", { class: "sub" }, `${when(order.reviewed_at)} · ${order.ship_to.country}`),
          pill(order.action));
        if (seen && !seen.has(order.order_id)) row.classList.add("arrived");
        row.addEventListener("click", () => choose(order.order_id, true));  // so arrow keys carry on from here
        row.addEventListener("keydown", (event) => {
          const next = { ArrowDown: index + 1, ArrowUp: index - 1 }[event.key];
          if (event.key === "Enter") choose(order.order_id);
          if (next !== undefined && orders[next]) {
            event.preventDefault();
            choose(orders[next].order_id, true);
          }
        });
        return row;
      }));
      document.getElementById("empty").hidden = orders.length > 0;
    }

    function meter(order) {
      const { probability, hold_above: holdAbove } = order.decision;
      if (probability === null || probability === undefined || holdAbove === null || holdAbove === undefined) {
        return el("div");
      }
      const scale = Math.min(1, Math.max(0.5, probability * 1.25, holdAbove * 1.25));
      const fill = el("div", { class: `fill ${order.action}` });
      fill.style.width = `${(probability / scale) * 100}%`;
      const line = el("div", { class: "line", title: "Holding pays above this risk" });
      line.style.left = `${(holdAbove / scale) * 100}%`;
      return el("div", { class: "meter" }, el("div", { class: "track" }, fill, line),
        el("div", { class: "legend" },
          el("span", {}, `Estimated risk ${percent(probability)}`),
          el("span", {}, `Holding pays above ${percent(holdAbove)}`)));
    }

    function block(title, ...children) {
      return el("div", { class: "block" }, el("h3", {}, title), ...children);
    }

    function renderDetail() {
      const order = orders.find(o => o.order_id === selected);
      if (!order) return;
      const { decision, review } = order;
      const parts = [
        el("div", { class: `head ${order.action}` },
          el("span", { class: "badge" }, icon(order.action)),
          el("div", {},
            el("p", { class: `eyebrow ${order.action}` }, `${money(order)} from ${order.buyer.name}`),
            el("h2", {}, verdict(order)))),
        el("p", { class: "reason" }, decision.reason),
        // Without an AI answer the order is held whatever the estimate, so the meter would mislead
        decision.model_band === null ? el("div") : meter(order),
        el("p", { class: "meta" }, when(order.reviewed_at), " · ", el("span", { class: "mono" }, order.order_id)),
      ];

      if (review.explanation) {
        const found = [el("p", { class: "explanation" }, review.explanation)];
        if (review.reasons.length) found.push(el("ul", {}, ...review.reasons.map(r => el("li", {}, r))));
        const lookups = [...new Set([...Object.keys(TOOLS), ...review.looked_at])].map(name => {
          const used = review.looked_at.includes(name);
          return el("div", { class: used ? "lookup" : "lookup unused" }, icon(name),
            el("div", {}, TOOLS[name] || name, el("small", {}, used ? "Looked up" : "Not looked up")));
        });
        found.push(el("div", { class: "lookups" }, ...lookups),
          el("p", { class: "looked" }, `Reviewed by ${review.model}`));
        parts.push(block("What the AI found", ...found));
      }
      if (review.errors.length) {
        parts.push(block("AI review not used", el("p", { class: "errors" }, capital(review.errors.join("; ")))));
      }
      if (review.buyer_message) {
        parts.push(block("Suggested message to the buyer", el("blockquote", {}, review.buyer_message)));
      }

      const stop = (label, value, iconName, tone) => el("div", { class: "stop" },
        el("span", { class: `badge ${tone}` }, icon(iconName)),
        el("div", { class: "label" }, label), el("div", { class: "value" }, value));
      const band = (value) => BAND_TONE[value] || "none";
      parts.push(block("How it was decided",
        el("div", { class: "flow" },
          stop("Rules", capital(decision.rule_band), "rules", band(decision.rule_band)),
          stop("AI review", capital(decision.model_band ?? "no answer"), "ai", band(decision.model_band)),
          stop("Final risk", capital(order.band), "risk", band(order.band)),
          stop("Decision", ACTIONS[order.action] || order.action, order.action, order.action)),
        el("p", { class: "money" },
          `Money at risk if this order goes wrong: ${money(order, decision.money_at_risk_cents)}`)));

      parts.push(block("Checks", el("ul", { class: "signals" }, ...order.signals.map(signal =>
        el("li", {}, el("span", { class: `level level-${signal.level}` }, signal.level), signal.summary)))));

      parts.push(block("Order", el("dl", {},
        el("dt", {}, "Buyer"), el("dd", {}, `${order.buyer.name} (${order.buyer.email})`),
        el("dt", {}, "PayPal account"), el("dd", {}, `${capital(order.buyer.account_status.toLowerCase()) || "Status unknown"}, ${order.buyer.country}`),
        el("dt", {}, "Ship to"), el("dd", {}, `${order.ship_to.name}, ${order.ship_to.address}`),
        el("dt", {}, "Seller Protection"), el("dd", {},
          PROTECTION[order.seller_protection] || order.seller_protection))));
      document.getElementById("detail").replaceChildren(...parts);
    }

    function renderStatus(ok) {
      document.getElementById("status").classList.toggle("offline", !ok);
      const seconds = Math.round((Date.now() - lastUpdate) / 1000);
      document.getElementById("status-text").textContent = !ok ? "Can't reach ShipSafe. Retrying."
        : seconds < 5 ? "Live. Updated just now." : `Live. Updated ${seconds}s ago.`;
    }

    async function refresh() {
      let data;
      try {
        const response = await fetch("/api/reviews");
        if (!response.ok) throw new Error(response.status);
        data = await response.text();
        lastUpdate = Date.now();
      } catch {
        renderStatus(false);
        return;
      }
      renderStatus(true);
      // Redrawing drops keyboard focus and any text the seller has selected, so only redraw on change
      if (data === lastData) return;
      lastData = data;
      orders = JSON.parse(data).orders;
      const focused = document.activeElement?.closest?.(".row")?.dataset.id;
      if (following || !orders.some(o => o.order_id === selected)) {
        selected = orders[0]?.order_id ?? null;
      }
      renderCounts();
      renderRows();
      renderDetail();
      if (focused) document.querySelector(`.row[data-id="${CSS.escape(focused)}"]`)?.focus();
      seen = new Set(orders.map(o => o.order_id));
    }

    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
    setInterval(() => {
      if (lastUpdate) renderStatus(!document.getElementById("status").classList.contains("offline"));
    }, 1000);
  </script>
</body>
</html>
